
services:
  postgres:
    image: postgres:17-alpine
    container_name: deployguard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: deployguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: deployguard_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U deployguard -d deployguard_db
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: